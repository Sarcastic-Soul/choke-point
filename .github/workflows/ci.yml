name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FALKORDB_URL: falkor://localhost:6379
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        # The image ships redis-cli, so tests only start once the database answers.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with "packageManager" in package.json.
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun test
      # The build downloads Google Fonts, which GitHub runners can reach.
      - run: bun run build
